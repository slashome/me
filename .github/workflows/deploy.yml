name: Deploy to GitHub Pages

on:
  # Le moteur change → le site change.
  push:
    branches: [main]
  # Le CONTENU change → le site change aussi. slashome/_me envoie cet événement
  # à chaque push sur sa branche main : le site est le produit des deux dépôts,
  # donc chacun doit pouvoir le republier.
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

# Un seul déploiement à la fois ; on ne coupe pas celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Le moteur
        uses: actions/checkout@v4

      # Le contenu, à sa dernière version. Le sens de l'épinglage est
      # volontairement asymétrique : _me épingle une VERSION du moteur (son
      # schéma doit être stable), le moteur prend le contenu LIVE (une citation
      # ajoutée doit paraître sans qu'on retague quoi que ce soit).
      - name: Le contenu
        uses: actions/checkout@v4
        with:
          repository: slashome/_me
          ref: main
          path: content

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
